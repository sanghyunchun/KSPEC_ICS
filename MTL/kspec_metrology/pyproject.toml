[tool.poetry]
name = "kspec_metrology"
version = "0.3.0"
description = "KSPEC focal plane metrology: QHY camera exposure, peak finding, fiber matching, distortion fitting"
authors = ["Dongkok Kim"]
license = "BSD-3-Clause"
readme = "README.md"
packages = [
	{include = "kspec_metrology"},
]
include = [
	{path = "kspec_metrology/lib/*", format="wheel"},
	{path = "kspec_metrology/analysis/*.txt"},
	# mock 데이터. 이미지(.fits)는 용량 때문에 뺀다.
	# 여기 glob이 .fits까지 잡으면 exclude보다 우선해서 들어가 버리므로,
	# 넣을 것만 하나씩 적는다.
	{path = "kspec_metrology/tmp/README.md"},
	{path = "kspec_metrology/tmp/object.info"},
]
exclude = [
	"kspec_metrology/.claude/**",
	"**/__pycache__/**",
	# mock 이미지는 416MB라 배포 패키지에 넣지 않는다 (넣으면 pip install이
	# 그만큼 무거워진다). 저장소에서도 .gitignore로 빠져 있고, 따로 공유한다.
	# truth npz(분석에 안 쓰임)와 run_mock이 만드는 결과 json도 뺀다.
	# tmp/의 나머지(object.info, README)는 위 include로 같이 들어간다.
	"kspec_metrology/tmp/*.fits",
	"kspec_metrology/tmp/*.npz",
	"kspec_metrology/tmp/*.json",
]

# 하한만 지정하고 상한은 열어둡니다.
# 코드가 쓰는 API는 numpy/scipy/astropy/photutils의 오래된 안정 코어뿐이라
# (arctan2, curve_fit, cKDTree, fits.getdata, sigma_clipped_stats, find_peaks)
# 상한을 걸 근거가 없습니다.
#
# python 하한이 3.11인 이유: astropy>=7, photutils>=2, scipy>=1.15가
# 모두 Requires-Python >=3.11 입니다. 3.9/3.10까지 열면 poetry가
# astropy<6 / photutils<2 로 강제 고정합니다.
[tool.poetry.dependencies]
python = ">=3.11,<4.0"
numpy = ">=1.24"       # astropy>=7 요구 하한
scipy = ">=1.11"       # photutils>=2 요구 하한
astropy = ">=5.3"      # photutils>=2 요구 하한
photutils = ">=1.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
